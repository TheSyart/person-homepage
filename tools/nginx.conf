    # ===== 端口 80 默认兜底：未匹配的 Host（含已下线的子域名）一律返回 404 =====
    # 已下线：sporter / funcavatar / protect / myhero / muyu / merry.christmas.httpx.vip
    # （站点目录仍保留在 /opt 下，如需恢复取消注释原 server 块即可，见 nginx.conf.bak-20260817-rebuild）
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }

server {
    listen 80;
    server_name digital.shanchen.space;

    root /opt/digital/vue;
    index index.html;
    client_max_body_size 300M;

    # API proxy - remove /api prefix and forward to backend
    location /api/ {
        proxy_pass http://118.178.254.196:8082/;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # websocket proxy
    location /ws {
        proxy_pass http://118.178.254.196:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name digital.shanchen.space;

    ssl_certificate /etc/letsencrypt/live/digital.shanchen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digital.shanchen.space/privkey.pem;
    include /soft/nginx/conf/ssl-params.conf;

    root /opt/digital/vue;
    index index.html;
    client_max_body_size 300M;

    location /api/ {
        proxy_pass http://118.178.254.196:8082/;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass http://118.178.254.196:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name www.shanchen.space shanchen.space;
    include /soft/nginx/conf/letsencrypt-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.shanchen.space shanchen.space;

    root /opt/person;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.shanchen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.shanchen.space/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 圣诞子页已删除，显式 404（避免落到 SPA 回退）
    location /christmas/ {
        return 404;
    }

    # B站数据代理：/api/bilibili/x/relation/stat?vmid=... -> api.bilibili.com
    location /api/bilibili/ {
        proxy_pass https://api.bilibili.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bilibili.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
        proxy_set_header Referer "https://space.bilibili.com/";
        # 强制上游不压缩，避免缓存的 gzip 体下发给不支持压缩的客户端
        proxy_set_header Accept-Encoding "";
        proxy_cache bili;
        proxy_cache_valid 200 10m;
        proxy_cache_key $uri;
        # bilibili 响应带 Set-Cookie，默认禁缓存；忽略之并禁止下发给访客
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        add_header X-Bili-Cache $upstream_cache_status;
    }

    # person-api：文章/视频/留言/管理接口 -> 127.0.0.1:3081
    location /api/ {
        proxy_pass http://127.0.0.1:3081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:ico|css|js|jpg|jpeg|png|gif|svg|ogg|mp3|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri /index.html;
    }
}

    include /soft/nginx/conf/deepseek-harness.conf;
    include /soft/nginx/conf/model-center.conf;
    include /soft/nginx/conf/serverops.conf;
}
